services:
  - type: web
    name: vaccination-drive-payment
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_UPI_ID
        sync: false
      - key: PAYMENT_PAYEE_NAME
        sync: false
    disk:
      name: vaccination-drive-data
      mountPath: /var/data
      sizeGB: 1
