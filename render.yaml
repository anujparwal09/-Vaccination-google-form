services:
  - type: web
    name: vaccination-drive-payment
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PAYMENT_UPI_ID
        value: 9325339930@sbi
      - key: PAYMENT_PAYEE_NAME
        value: Yash Biyani
    disk:
      name: vaccination-drive-data
      mountPath: /var/data
      sizeGB: 1
